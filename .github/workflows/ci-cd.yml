name: API CI and container release
on:
  pull_request:
  push:
    branches: [staging, main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: settlr
          POSTGRES_PASSWORD: settlr
          POSTGRES_DB: settlr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U settlr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://settlr:settlr@localhost:5432/settlr_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./cmd/settlr
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  publish-container:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/settlr-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-container
    runs-on: ubuntu-latest
    concurrency:
      group: settlr-production-deploy
      cancel-in-progress: false
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "${{ secrets.HETZNER_HOST }}" ] || [ -z "${{ secrets.HETZNER_SSH_KEY }}" ] || [ -z "${{ secrets.HETZNER_USER }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HETZNER_HOST/HETZNER_SSH_KEY/HETZNER_USER not set — skipping deploy (public fork safe)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure dedicated deployment key
        if: steps.check.outputs.skip == 'false'
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Deploy the approved Docker Hub digest
        if: steps.check.outputs.skip == 'false'
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/settlr-api@${{ needs.publish-container.outputs.image_digest }}
        run: |
          ssh -4 -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new \
            "$USER@$HOST" "sudo -n /usr/local/sbin/settlr-deploy-image '$IMAGE'"
      - name: Verify public readiness
        env:
          HEALTH_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "PRODUCTION_API_URL not set — skipping public readiness check (public fork)"
            exit 0
          fi
          curl --fail --retry 10 --retry-delay 3 --silent --show-error "$HEALTH_URL/readyz"
