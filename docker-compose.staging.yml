services:
  postgres:
    container_name: settlr-postgres-staging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-settlr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging-password-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-settlr}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    container_name: settlr-backend-staging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://settlr:staging-password-change-me@postgres:5432/settlr?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-staging-jwt-secret-change-me-32chars-minimum-012345}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-staging-refresh-secret-change-me-32chars-min-012345}
      PORT: 8080
      APP_ENV: staging
      APP_URL: https://settlr-staging.vercel.app
      API_URL: https://settlrapi.theswissknife.com
      CORS_ORIGINS: https://settlr-staging.vercel.app,https://settlr.theswissknife.com,https://arch.tailbd5522.ts.net
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-noreply@settlr.app}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Settlr}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
volumes:
  pgdata:
  uploads:
