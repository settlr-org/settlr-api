services:
  postgres:
    container_name: settlr-postgres-staging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-settlr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging-password-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-settlr}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    container_name: settlr-backend-staging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://settlr:staging-password-change-me@postgres:5432/settlr?sslmode=disable
      JWT_SECRET: 6bd3d8a9918d1a2bfff5591b7c221bb1f327a9727fc8f781721976d3ac9422e4
      JWT_REFRESH_SECRET: 763275638a34088088b5e15388d3634548377b2101dd65d60ebf64c57a2dd2d1
      PORT: 8080
      APP_ENV: staging
      APP_URL: https://settlr-staging.vercel.app
      API_URL: https://settlrapi.theswissknife.com
      CORS_ORIGINS: https://settlr-staging.vercel.app,https://settlr.theswissknife.com,https://arch.tailbd5522.ts.net
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-noreply@settlr.app}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Settlr}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
volumes:
  pgdata:
  uploads:
