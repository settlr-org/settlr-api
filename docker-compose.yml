services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-settlr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-settlr}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://settlr:local-dev-password@postgres:5432/settlr?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-0123456789abcdef-change-me-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-dev-refresh-secret-0123456789abcdef-change-me-32chars}
      PORT: 8080
      APP_ENV: ${APP_ENV:-staging}
      APP_URL: ${APP_URL:-https://example.com}
      API_URL: ${API_URL:-https://api.example.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://example.com,https://staging.example.net}
      # Google ID tokens must be verified against the public client IDs used by
      # the web and mobile applications. Leave this empty only when Google
      # sign-in is intentionally disabled.
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-noreply@settlr.app}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Settlr}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
volumes:
  pgdata:
  uploads:
