# Install at /etc/nginx/sites-available/settlrapi.theswissknife.com.
# Certbot adds the TLS listener/certificate directives after DNS points here.
server {
    listen 80;
    listen [::]:80;
    server_name settlrapi.theswissknife.com;

    # Keep this location available for the HTTP-01 ACME challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name settlrapi.theswissknife.com;

    # These paths are created by certbot. Do not enable this server before the
    # certificate exists; provision.sh installs the HTTP server first.
    ssl_certificate /etc/letsencrypt/live/settlrapi.theswissknife.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/settlrapi.theswissknife.com/privkey.pem;
    # Keep TLS settings here rather than depending on a distro-specific
    # Certbot helper file that `certbot certonly` does not always install.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, rather than append, client-supplied forwarding headers:
        # the application trusts these only because this Nginx process sets them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
    }
}
