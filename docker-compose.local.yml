services:
  postgres:
    container_name: settlr-postgres-local
    environment:
      POSTGRES_USER: settlr
      POSTGRES_PASSWORD: local-dev-password
      POSTGRES_DB: settlr_local
    volumes:
      - pgdata-local:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: settlr-mailpit-local
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  api:
    container_name: settlr-api-local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://settlr:local-dev-password@postgres:5432/settlr_local?sslmode=disable
      JWT_SECRET: local-dev-jwt-secret-0123456789abcdef-change-me-32chars
      JWT_REFRESH_SECRET: local-dev-refresh-secret-0123456789abcdef-change-me-32chars
      PORT: 8080
      APP_ENV: development
      APP_URL: http://localhost:3000
      API_URL: http://localhost:18080
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:19006,http://127.0.0.1:3000,http://127.0.0.1:19006
      MAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      BREVO_API_KEY: ""
      MAIL_FROM_EMAIL: noreply@localhost
      MAIL_FROM_NAME: Settlr
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - uploads-local:/app/uploads
    restart: unless-stopped

volumes:
  pgdata-local:
  uploads-local:
