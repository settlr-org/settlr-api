name: settlr-production

services:
  postgres:
    container_name: settlr-postgres-production
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-settlr}
    volumes:
      - production-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    container_name: settlr-backend-production
    image: ${API_IMAGE:?set API_IMAGE to an immutable GHCR image digest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      PORT: 8080
      APP_ENV: production
      APP_URL: ${APP_URL:-https://settlr.theswissknife.com}
      API_URL: ${API_URL:-https://settlrapi.theswissknife.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://settlr.theswissknife.com}
      # The API is reachable only through the loopback Nginx proxy below.
      TRUST_PROXY_HEADERS: "true"
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-noreply@settlr.app}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Settlr}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - production-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  production-pgdata:
  production-uploads:
